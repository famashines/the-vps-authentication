name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: RELEASE=${{ github.event.pull_request.head.sha }}
